name: verify

on:
  push:
    paths: ["codes/**", "tests/**", "build.py", "Codebook*.tex", "fonts/**", ".github/workflows/verify.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  # 段落 hash 是否為最新（不用產生測資，約 10 秒）
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/check_hash.py

  # 用 build.py 產生 Codebook.pdf，可在 Actions 頁面下載；超過 25 頁就失敗
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-xetex texlive-lang-cjk texlive-lang-chinese texlive-latex-extra poppler-utils > /dev/null
      # 先刪掉 repo 裡的舊 PDF，xelatex 失敗時才不會拿舊檔通過檢查
      - run: rm -f Codebook.pdf && python3 build.py && grep -q "Output written on Codebook.pdf" Codebook.log
      - run: |
          pages=$(pdfinfo Codebook.pdf | awk '/^Pages:/ {print $2}')
          echo "Codebook.pdf：$pages 頁（上限 25）" >> "$GITHUB_STEP_SUMMARY"
          [ "$pages" -le 25 ] || { echo "超過 25 頁：$pages"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Codebook
          path: |
            Codebook.pdf
            Codebook.log

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install competitive-verifier
      # 快取 Library Checker 產生的測資，避免每次重新生成
      - uses: actions/cache@v4
        with:
          path: .competitive-verifier/cache
          key: cv-${{ hashFiles('tests/**') }}
          restore-keys: cv-
      - run: python3 tests/build_geometry.py
      # math_brute 引用 Lucas's_Theorem.cpp，檔名的 ' 會讓 oj-resolve 的 shlex 當掉，改成直接編譯執行
      - run: g++ -std=c++17 -O2 -I. tests/math_brute.test.cpp -o /tmp/math_brute && /tmp/math_brute
      - run: competitive-verifier oj-resolve --include tests --exclude tests/math_brute.test.cpp --config tests/config.toml > verify_files.json
      - run: |
          ulimit -s unlimited
          competitive-verifier verify --verify-json verify_files.json --check-error --write-summary
